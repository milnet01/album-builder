[project]
name = "album-builder"
version = "1.1.0"
description = "Curate albums from a folder of audio recordings"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[project.scripts]
album-builder = "album_builder.app:run"

# Spec 27: a complete wheel for the openSUSE package. The AppImage and
# Windows builds copy src/ and do not use this.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
# requirements.txt stays the one list of runtime dependencies.
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
album_builder = ["translations/*.json", "services/templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --no-qt-log: stop pytest-qt installing its own Python Qt-message handler per
# test. We install Qt's native C++ default handler session-wide instead (see
# tests/conftest.py::_qt_native_message_handler) to avoid an FFmpeg-backend
# teardown deadlock; pytest-qt's per-test handler would otherwise re-introduce
# the Python (GIL-taking) handler and the deadlock with it.
addopts = "-ra -q --no-qt-log"
qt_api = "pyqt6"
# A pre-push gate run on 2026-09-25 hung for 10+ minutes in a futex wait and
# did not reproduce in three reruns. If a test hangs again, print every
# thread's stack after 120 s so the next occurrence names itself.
faulthandler_timeout = 120
pythonpath = ["src"]
markers = [
    "slow: real WeasyPrint render or other > 1s setup; opt out via `-m 'not slow'`",
]
