name: Windows

# Build the downloadable Windows bundle and installer (Spec 24 / Phase Dist-3,
# MUSI-0406) on a version tag or on demand. It does NOT run on every push -
# ci.yml stays fast. The whole build lives in packaging/build-windows.ps1;
# this workflow only invokes that script, smoke-tests the artifacts, verifies
# the built folder, and uploads to the Release (INV-24-9: no build stages of
# its own).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create/update the Release and upload the asset (INV-24-8)

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false   # a release build is never cancelled half-way

jobs:
  windows:
    runs-on: windows-2025
    # ~3-4 min measured; sized for a cold MSYS2/pip download with a wide margin.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build the Windows bundle
        shell: pwsh
        run: .\packaging\build-windows.ps1

      - name: Verify the built folder (static)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = "dist\AlbumBuilder"
          # INV-24-3 (source): stage 1 reads version.py, not pyproject.toml.
          if (-not (Select-String -Path packaging\build-windows.ps1 -Pattern 'version\.py' -Quiet)) {
            throw "build script does not read version.py"
          }
          # INV-24-4: no writable-state marker leaks into the bundle.
          if (Get-ChildItem $app -Recurse -Filter pyproject.toml) { throw "pyproject.toml in bundle" }
          # INV-24-5: the heavy ML stack is absent.
          if (Get-ChildItem $app -Recurse -Directory | Where-Object { $_.Name -in @('torch','whisperx') }) {
            throw "torch/whisperx in bundle"
          }
          # INV-24-2 (b): the WeasyPrint DLL closure is present (mask-proof half).
          foreach ($dll in @('libgobject-2.0-0.dll','libpango-1.0-0.dll','libfontconfig-1.dll')) {
            if (-not (Get-ChildItem $app -Recurse -Filter $dll)) { throw "missing bundled DLL: $dll" }
          }

      - name: Smoke-test the .exe (INV-24-1/2/3)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Scrub MSYS2's mingw64\bin from PATH so a green --selftest proves the
          # BUNDLED DLLs load, not the build's system GTK (Spec 24 INV-24-2).
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike '*msys64*' }) -join ';'
          $exe = "dist\AlbumBuilder\AlbumBuilder.exe"
          $printed = (& $exe --version).Trim()
          Write-Host "printed version: $printed"
          $zip = Get-ChildItem dist -Filter 'AlbumBuilder-*-windows-x64.zip' | Select-Object -First 1
          $fver = ($zip.Name -replace '^AlbumBuilder-(.*)-windows-x64\.zip$', '$1')
          if ($printed -ne $fver) { throw "version mismatch: exe=$printed zip=$fver" }   # INV-24-3
          & $exe --selftest                                                              # INV-24-2
          if ($LASTEXITCODE -ne 0) { throw "--selftest failed ($LASTEXITCODE)" }

      - name: Install, run and uninstall the installer (INV-24-12)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem dist -Filter 'AlbumBuilder-*-windows-x64-setup.exe' | Select-Object -First 1
          $fver = ($setup.Name -replace '^AlbumBuilder-(.*)-windows-x64-setup\.exe$', '$1')
          $dir = Join-Path $env:RUNNER_TEMP "ab-installed"
          $p = Start-Process -Wait -PassThru $setup.FullName -ArgumentList `
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`""
          if ($p.ExitCode -ne 0) { throw "silent install failed ($($p.ExitCode))" }
          # The marker Spec 28 reads, so this copy updates itself.
          if ((Get-Content "$dir\install-kind.txt" -Raw).Trim() -ne "installer") {
            throw "install-kind.txt does not read 'installer'"
          }
          $printed = (& "$dir\AlbumBuilder.exe" --version).Trim()
          if ($printed -ne $fver) { throw "installed version mismatch: exe=$printed setup=$fver" }
          & "$dir\AlbumBuilder.exe" --selftest
          if ($LASTEXITCODE -ne 0) { throw "installed --selftest failed ($LASTEXITCODE)" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Album Builder.lnk")) {
            throw "no Start menu entry"
          }
          # Uninstall keeps the user's settings and albums, which live outside it.
          $keep = Join-Path $env:LOCALAPPDATA "album-builder\keep-me.txt"
          New-Item -ItemType File -Force -Path $keep | Out-Null
          & "$dir\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          # The uninstaller hands off to a copy of itself and returns at once.
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\AlbumBuilder.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\AlbumBuilder.exe") { throw "uninstall left AlbumBuilder.exe" }
          if (-not (Test-Path $keep)) { throw "uninstall removed the user's settings folder" }

      - name: Keep the zip for a manual test (non-tag runs)
        # A workflow_dispatch run on a branch publishes nothing; this keeps
        # the zip downloadable (gh run download) so a Windows fix can be
        # checked on a real machine before it is released.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: |
            dist/AlbumBuilder-*-windows-x64.zip
            dist/AlbumBuilder-*-windows-x64-setup.exe
          retention-days: 7

      - name: Upload the zip and the installer to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/AlbumBuilder-*-windows-x64.zip
            dist/AlbumBuilder-*-windows-x64-setup.exe
