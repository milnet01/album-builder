name: CI

# Lint + full test suite on every push to main and every pull request.
# The single check step is `./local-CI.sh`, so a green local run and a green
# CI run exercise the identical commands -- they cannot drift.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          # Match the developer's local interpreter so local-CI.sh and this
          # run are the same Python. (pyproject floor is 3.11; bump/extend to
          # a matrix here if the support range ever needs CI coverage.)
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install system libraries
        # WeasyPrint (report generation, exercised by the `slow` tests) needs
        # Pango at import time; the PyQt6 wheel's platform + multimedia plugins
        # need GL/EGL/xkbcommon/dbus and the ALSA/Pulse client libs to load.
        # No audio *server* is required: the suite runs headless via the
        # offscreen QPA and the real QMediaPlayer reaches its states without a
        # sink (verified locally with the audio device masked).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libpulse0 libasound2t64

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Run CI checks (lint + tests)
        run: ./local-CI.sh
