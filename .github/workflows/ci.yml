name: CI

# Lint + full test suite on every push to main and every pull request.
# The single check step is `./local-CI.sh`, so a green local run and a green
# CI run exercise the identical commands. A local run also upgrades its venv
# to the newest releases first, matching the fresh install below.

# A documentation-only push to main runs nothing here: no test reads a .md file and
# ruff reads only Python. Keep this list equal to `git config
# ants.gate.docsGlob`; the pre-push hook runs `./local-CI.sh --docs` (the
# Markdown link check) for the same paths.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:   # always runs everything (local-gate.md 9)

permissions:
  contents: read

# Group by workflow, event and ref so a push and a pull request never cancel
# each other. Cancel superseded runs only off main: on main a cancelled run
# hides which commit broke the build (local-gate.md 9).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    # ~1 min warm; sized for a cold pip cache with a wide margin.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          # Match the developer's local interpreter so local-CI.sh and this
          # run are the same Python. (pyproject floor is 3.11; bump/extend to
          # a matrix here if the support range ever needs CI coverage.)
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install system libraries
        # WeasyPrint (report generation, exercised by the `slow` tests) needs
        # Pango at import time; the PyQt6 wheel's platform + multimedia plugins
        # need GL/EGL/xkbcommon/dbus and the ALSA/Pulse client libs to load.
        # No audio *server* is required: the suite runs headless via the
        # offscreen QPA and the real QMediaPlayer reaches its states without a
        # sink (verified locally with the audio device masked). `dbus` (not
        # just libdbus-1-3) supplies dbus-run-session, which local-CI.sh uses
        # to give the suite a private session bus so the MPRIS wire-signature
        # test runs here rather than skipping. `libharfbuzz-subset0` stops
        # WeasyPrint's "HarfBuzz-Subset will be required" warning, and
        # `desktop-file-utils` lets TC-23-03's .desktop check run instead of
        # skipping; the developer machine has both, so local and CI now run
        # the same tests (2026-10-10). `elfutils` supplies eu-stack, which the
        # test hang watchdog (tests/_hang_watchdog.py, MUSI-0388) uses to print
        # a native stack of a test stuck past 60 s.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            fonts-dejavu-core libgl1 libegl1 libxkbcommon0 libdbus-1-3 dbus \
            libpulse0 libasound2t64 desktop-file-utils elfutils

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Run CI checks (lint + tests)
        run: ./local-CI.sh
