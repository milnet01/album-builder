name: AppImage

# Build the downloadable AppImage (Spec 23 / Phase Dist-2) on a version tag or on
# demand. It does NOT run on every push - ci.yml stays fast. The whole build lives
# in packaging/build-appimage.sh; this workflow only invokes that script, smoke-
# tests the artifact, verifies the extracted bundle, and uploads to the Release
# (INV-23-9: no build stages of its own).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create/update the Release and upload the asset (INV-23-8)

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    # The ubuntu:22.04 build container (build-appimage.sh), not this runner, sets
    # the glibc floor - so pinning the runner like ci.yml is safe (INV-23-7).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build the AppImage
        run: ./packaging/build-appimage.sh

      - name: Verify the extracted bundle (static, no run)
        # No AppImage run here: the headless runner lacks the base GL/EGL libs a
        # real desktop has (running happens in the clean container below). Grep +
        # coreutils + --appimage-extract only; no apt/pip/build (INV-23-9). The
        # .desktop is validated by build-appimage.sh stage 5.
        run: |
          set -euo pipefail
          app=$(echo dist/AlbumBuilder-*-x86_64.AppImage)
          # INV-23-3 (source): stage 1 reads version.py, not pyproject.toml.
          grep -q "version.py" packaging/build-appimage.sh
          "$app" --appimage-extract >/dev/null
          root=squashfs-root
          # INV-23-4: no writable state leaks into the read-only mount.
          test -z "$(find "$root" -name pyproject.toml)"
          ! grep -q ALBUM_BUILDER_DEV_MODE "$root/AppRun"
          # INV-23-5: the heavy ML stack is absent.
          test -z "$(find "$root" -maxdepth 6 \( -name torch -o -name whisperx \))"
          # INV-23-2 (real bundle): the five required sonames + a font + fonts.conf.
          # libharfbuzz-subset.so.0 is optional (WeasyPrint allow_fail; absent on
          # ubuntu:22.04) so it is not required here.
          for so in libgobject-2.0.so.0 libpango-1.0.so.0 libpangoft2-1.0.so.0 \
                    libharfbuzz.so.0 libfontconfig.so.1; do
            test -e "$root/usr/lib/$so" || { echo "missing bundled lib: $so"; exit 1; }
          done
          test -e "$root/etc/fonts/fonts.conf"
          test -n "$(find "$root/usr/share/fonts" -name '*.ttf')"

      - name: Run the AppImage in a clean container (INV-23-1/2/3)
        # The definitive run: a fresh ubuntu:22.04 with ONLY base host libs
        # (GL/EGL/xkb/dbus) and NOT the WeasyPrint/Pango stack. A green --version
        # proves Python + Qt are bundled; a green --selftest proves the native
        # render libs are bundled, not borrowed from the host. Verification, not a
        # build step (INV-23-9). Base-image digest read from build-appimage.sh.
        run: |
          set -euo pipefail
          base=$(grep -oE 'ubuntu:22\.04@sha256:[a-f0-9]+' packaging/build-appimage.sh | head -1)
          app=$(echo dist/AlbumBuilder-*-x86_64.AppImage)
          fver=$(basename "$app" | sed -n 's/^AlbumBuilder-\(.*\)-x86_64\.AppImage$/\1/p')
          echo "clean-room image: $base   expected version: $fver"
          docker run --rm -e FVER="$fver" -v "$PWD:/w" -w /w "$base" bash -c '
            set -e
            apt-get update -qq
            # Base desktop libs a real desktop always has (GL/EGL drivers + the
            # audio client libs) - deliberately host-provided, not bundled (§3).
            # NOT the WeasyPrint/Pango stack: that must come from the AppImage.
            apt-get install -y -qq --no-install-recommends \
              libgl1 libegl1 libxkbcommon0 libdbus-1-3 libpulse0 libasound2 >/dev/null
            a=$(echo /w/dist/AlbumBuilder-*-x86_64.AppImage)
            printed=$("$a" --appimage-extract-and-run --version)   # INV-23-1
            echo "printed version: $printed"
            test "$printed" = "$FVER"                              # INV-23-3
            "$a" --appimage-extract-and-run --selftest             # INV-23-2 (definitive)
          '

      - name: appimagelint compatibility report
        # Best-effort: appimagelint runs the AppImage across distro base images and
        # reports its glibc requirement + per-distro compatibility. It ships only a
        # rolling "continuous" build (no version to pin) and its matrix can be
        # flaky/slow, and it is a post-build REPORT tool that never enters the
        # artifact - so it reports but does not gate (continue-on-error).
        continue-on-error: true
        run: |
          set -euo pipefail
          app=$(echo dist/AlbumBuilder-*-x86_64.AppImage)
          wget -q "https://github.com/TheAssassin/appimagelint/releases/download/continuous/appimagelint-x86_64.AppImage" \
            -O appimagelint.AppImage
          chmod +x appimagelint.AppImage
          ./appimagelint.AppImage --appimage-extract-and-run "$app"

      - name: Upload the AppImage to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AlbumBuilder-*-x86_64.AppImage
