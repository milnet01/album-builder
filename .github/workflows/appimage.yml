name: AppImage

# Build the downloadable AppImage (Spec 23 / Phase Dist-2) on a version tag or on
# demand. It does NOT run on every push - ci.yml stays fast. The whole build lives
# in packaging/build-appimage.sh; this workflow only invokes that script, smoke-
# tests the artifact, verifies the extracted bundle, and uploads to the Release
# (INV-23-9: no build stages of its own).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create/update the Release and upload the asset (INV-23-8)

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    # The ubuntu:22.04 build container (build-appimage.sh), not this runner, sets
    # the glibc floor - so pinning the runner like ci.yml is safe (INV-23-7).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build the AppImage
        run: ./packaging/build-appimage.sh

      - name: Smoke-test the artifact
        run: |
          set -euo pipefail
          app=$(echo dist/AlbumBuilder-*-x86_64.AppImage)
          echo "artifact: $app"
          # INV-23-1: launches headlessly and prints the version.
          printed=$("$app" --version)
          echo "printed version: $printed"
          # INV-23-3: printed version == the <version> field in the filename.
          fname_ver=$(basename "$app" | sed -n 's/^AlbumBuilder-\(.*\)-x86_64\.AppImage$/\1/p')
          test "$printed" = "$fname_ver"
          # INV-23-3 (source): stage 1 reads version.py, not pyproject.toml.
          grep -q "version.py" packaging/build-appimage.sh
          # INV-23-2: WeasyPrint renders inside the bundle.
          "$app" --selftest

      - name: Verify the extracted bundle
        # Coreutils-only checks (no apt/pip/build stages here - INV-23-9). The
        # .desktop is validated by build-appimage.sh stage 5, inside the container.
        run: |
          set -euo pipefail
          app=$(echo dist/AlbumBuilder-*-x86_64.AppImage)
          "$app" --appimage-extract >/dev/null
          root=squashfs-root
          # INV-23-4: no writable state leaks into the read-only mount.
          test -z "$(find "$root" -name pyproject.toml)"
          ! grep -q ALBUM_BUILDER_DEV_MODE "$root/AppRun"
          # INV-23-5: the heavy ML stack is absent.
          test -z "$(find "$root" -maxdepth 6 \( -name torch -o -name whisperx \))"
          # INV-23-2 (real bundle): the six sonames + a font + fonts.conf are present.
          for so in libgobject-2.0.so.0 libpango-1.0.so.0 libpangoft2-1.0.so.0 \
                    libharfbuzz.so.0 libharfbuzz-subset.so.0 libfontconfig.so.1; do
            test -e "$root/usr/lib/$so" || { echo "missing bundled lib: $so"; exit 1; }
          done
          test -e "$root/etc/fonts/fonts.conf"
          test -n "$(find "$root/usr/share/fonts" -name '*.ttf')"

      - name: Upload the AppImage to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AlbumBuilder-*-x86_64.AppImage
